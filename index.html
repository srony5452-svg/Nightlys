<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DemoTrade</title><style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial}header{padding:18px 22px;background:#121a2d;display:flex;justify-content:space-between}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#121a2d;border:1px solid #2a3550;border-radius:12px;padding:18px;margin-bottom:18px}input,button{padding:11px;border-radius:8px;border:1px solid #394766;margin:5px 0;background:#0d1426;color:white}input{width:95%}button{cursor:pointer;background:#3558d4}.danger{background:#a43c4c}.green{background:#168a62}.muted{color:#9aa8c7;font-size:13px}.balance{font-size:30px;font-weight:bold}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2a3550;text-align:left;font-size:13px}
</style></head><body><header><b>DemoTrade <small>SIMULATION</small></b><span>Virtual money only</span></header><div class="wrap">
<div id="auth" class="card"><h2>Demo Account</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="username" placeholder="Username (for Sign Up)"><button onclick="signup()">Sign Up</button><button onclick="login()">Login</button><p id="msg" class="muted"></p></div>
<div id="app" class="hidden"><div class="card"><h2>Welcome, <span id="user"></span></h2><div class="muted">DEMO BALANCE</div><div class="balance">$<span id="bal"></span></div><input id="amt" type="number" value="500"><button class="green" onclick="trade('buy')">BUY</button><button class="danger" onclick="trade('sell')">SELL</button><button onclick="logout()">Logout</button></div>
<div class="card"><h3>Trade History</h3><table><thead><tr><th>Side</th><th>Amount</th><th>Price</th><th>Time</th></tr></thead><tbody id="hist"></tbody></table></div>
<div id="admin" class="card hidden"><h3>Admin — Demo Balance Control</h3><div id="users"></div></div></div></div>
<script>
let price=67250;const $=x=>document.getElementById(x);
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
async function signup(){try{await api('/api/register',{method:'POST',body:JSON.stringify({username:$('username').value,email:$('email').value,password:$('password').value})});load()}catch(e){$('msg').textContent=e.message}}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});load()}catch(e){$('msg').textContent=e.message}}
async function load(){try{let j=await api('/api/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=j.user.username;$('bal').textContent=j.user.balance.toLocaleString(undefined,{minimumFractionDigits:2});$('hist').innerHTML=j.trades.map(t=>`<tr><td>${t.side.toUpperCase()}</td><td>$${t.amount}</td><td>$${t.price}</td><td>${new Date(t.created_at).toLocaleString()}</td></tr>`).join('');if(j.user.admin){$('admin').classList.remove('hidden');let us=await api('/api/admin/users');$('users').innerHTML=us.map(u=>`<p>${u.username} — ${u.email} — $${u.balance} <input id="b${u.id}" placeholder="new balance"><button onclick="setb(${u.id})">Set</button></p>`).join('')}}catch(e){}}
async function trade(side){try{await api('/api/trade',{method:'POST',body:JSON.stringify({side,amount:Number($('amt').value),price})});load()}catch(e){alert(e.message)}}
async function setb(id){try{await api('/api/admin/balance',{method:'POST',body:JSON.stringify({userId:id,balance:Number($('b'+id).value)})});load()}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()} load();
</script></body></html>
